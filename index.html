<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>隱月的新娘</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div id="main">
      <div id="frame">
        <!-- 場景圖層（在背景圖之上、文字之下） -->
        <div id="stage"><div id="bg-layer"></div></div>
        <!-- 全螢幕特效：亂碼、閃光 -->
        <div id="fx-glitch" aria-hidden="true"></div>
        <div id="fx-flash" aria-hidden="true"></div>

        <!-- 控制按鈕 -->
        <div class="controls">
          <button class="icon-btn" id="bgmBtn" aria-label="靜音">♪</button>
          <button
            class="icon-btn"
            id="restartBtn"
            aria-label="重新開始"
            style="display: none"
          >
            ↺
          </button>
        </div>

        <!-- 初始頁面 -->
        <section class="screen center on" id="sc-cover">
          <!-- 點擊「進入怪談」時切換過去的第二張封面圖 -->
          <div class="cover-alt" aria-hidden="true"></div>
          <h1 class="cover-title">
            <img
              class="cover-logo"
              src="https://voldosiyprpqirsvlnmx.supabase.co/storage/v1/object/public/img/logo.webp"
              alt="隱月的新娘"
            />
          </h1>
          <button class="btn" id="startBtn">進入怪談</button>
          <button class="btn-ghost" id="galleryBtn" style="margin-top: 18px">
            結局圖鑑
          </button>
          <button class="btn-ghost" id="creditsBtn" style="margin-top: 6px">
            音樂來源
          </button>
        </section>

        <!-- 遊戲主畫面 -->
        <section class="screen" id="sc-intro">
          <div class="narration">
            <p class="dialog" id="introText"></p>
            <div class="choices" id="choices"></div>
          </div>
          <p class="tap-hint" id="introHint">— 點擊繼續 —</p>
        </section>

        <!-- 結局畫面 -->
        <section class="screen center" id="sc-ending">
          <p class="ending-label" id="endingLabel">結局</p>
          <h2 class="ending-title" id="endingTitle"></h2>
          <p class="ending-desc" id="endingDesc"></p>
          <div class="ending-actions">
            <button class="btn" id="endingReplayBtn">回到開頭</button>
            <button class="btn-ghost" id="endingGalleryBtn">
              查看結局圖鑑
            </button>
          </div>
        </section>

        <!-- 結局圖鑑 -->
        <section class="screen" id="sc-gallery">
          <h2 class="gallery-title">結局圖鑑</h2>
          <p class="gallery-count" id="galleryCount"></p>
          <div class="gallery-grid" id="galleryGrid"></div>
          <button
            class="btn-ghost"
            id="galleryBackBtn"
            style="margin-top: 24px"
          >
            返回
          </button>
          <div class="gallery-note">
            <p class="gallery-note-title">前導故事聲明</p>
            <p>
              本篇內容為小說之前導故事，作為世界觀與劇情鋪陳之用。正式故事內容、角色設定及情節發展，皆以最終出版之書籍文本為準，後續內容仍可能依創作需求進行調整與修訂。
            </p>
          </div>
        </section>

        <!-- 音樂來源 -->
        <section class="screen" id="sc-credits">
          <h2 class="gallery-title">音樂來源</h2>
          <p class="gallery-count">Music powered by BreakingCopyright</p>
          <ul class="credits-list">
            <li>
              <a
                href="https://breakingcopyright.com/song/audionautix-horror-music"
                target="_blank"
                rel="noopener"
                >Horror Music</a
              >
              <span>by Audionautix</span>
              <span
                >Creative Commons (BY 4.0) |
                <a
                  href="https://creativecommons.org/licenses/by/4.0/"
                  target="_blank"
                  rel="noopener"
                  >License</a
                ></span
              >
            </li>
            <li>
              <a
                href="https://breakingcopyright.com/song/darren-curtis-witch-by-the-sea"
                target="_blank"
                rel="noopener"
                >Witch By The Sea</a
              >
              <span>by Darren Curtis</span>
              <span
                >Creative Commons (BY 3.0) |
                <a
                  href="https://creativecommons.org/licenses/by/3.0/"
                  target="_blank"
                  rel="noopener"
                  >License</a
                ></span
              >
            </li>
          </ul>
          <button
            class="btn-ghost"
            id="creditsBackBtn"
            style="margin-top: 24px"
          >
            返回
          </button>
        </section>

        <!-- 新結局解鎖提示 -->
        <div class="toast" id="toast"></div>
      </div>
    </div>

    <audio
      id="bgm"
      src="https://voldosiyprpqirsvlnmx.supabase.co/storage/v1/object/public/img/bgm/music.mp3"
      loop
      autoplay
    ></audio>
    <script src="index.js"></script>
  </body>
</html>
